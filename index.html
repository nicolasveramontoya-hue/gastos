<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=0">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230e6e63%27/%3E%3Cpath d=%27M16 7v18M21 11h-7a3.5 3.5 0 0 0 0 7h4a3.5 3.5 0 0 1 0 7h-7%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#f1f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<title>Gastos de casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --paper:#f1f4f6;
  --surface:#ffffff;
  --sunken:#e9edf1;
  --line:#dde4ea;
  --line-soft:#e9eef2;
  --ink:#131a20;
  --ink-2:#4c5a65;
  --mute:#7d8c98;
  --nico:#0e6e63;
  --nico-soft:#dcefec;
  --dani:#9b3a7d;
  --dani-soft:#f6e4f0;
  --danger:#ba1a1a;
  --lift:0 1px 1px rgba(19,26,32,.04), 0 10px 28px -16px rgba(19,26,32,.35);
  --lift-sm:0 2px 4px rgba(19,26,32,.06);
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111418;
    --surface:#1c2024;
    --sunken:#15181b;
    --line:#2e353b;
    --line-soft:#252b31;
    --ink:#f1f4f6;
    --ink-2:#abb7c2;
    --mute:#83929e;
    --nico:#4fc0b1;
    --nico-soft:#173634;
    --dani:#e08ac4;
    --dani-soft:#3d2435;
    --danger:#ff897d;
    --lift:0 1px 1px rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.9);
    --lift-sm:0 2px 4px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select,input,summary{touch-action:manipulation}
body:has(dialog[open]){overflow:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--nico);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- entrada ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:340px}
.gate h1{font-family:var(--display);font-size:32px;line-height:1.1;margin-bottom:8px}
.gate p{color:var(--mute);margin-bottom:24px;font-size:15px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
input:not([type=checkbox]):not([type=range]),select{
  width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background-color:var(--surface);color:var(--ink);font-size:16px;line-height:1.3;
}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input::placeholder{color:var(--mute);opacity:1}
input:focus,select:focus{outline:none;border-color:var(--nico);box-shadow:0 0 0 3px var(--nico-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;min-height:48px;border-radius:14px;background:var(--ink);color:var(--paper);
  font-weight:600;font-size:15.5px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-wide{width:100%}
.btn-quiet{background:var(--sunken);color:var(--ink)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink-2);margin:6px 0 20px}
.check input{width:18px;height:18px;accent-color:var(--nico)}
.alert{color:var(--danger);font-size:14px;margin-top:10px;display:none;font-weight:500}
.alert:not(:empty){display:block}

/* ---------- marco ---------- */
.topbar{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 85%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:699px){.monthnav{order:5;flex:1 1 100%;justify-content:space-between}.monthnav .label{flex:1}}
.brand{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.spacer{flex:1}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:3px;box-shadow:var(--lift-sm)}
.monthnav button{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.monthnav button:hover{background:var(--sunken);color:var(--ink)}
.monthnav .label{min-width:120px;text-align:center;font-size:14.5px;font-weight:600;
  position:relative;height:44px;line-height:44px;cursor:pointer}
.monthnav .label input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:0;background:none}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:960px;margin:0 auto;padding:22px 16px 120px}

/* ---------- la balanza ---------- */
.scales{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.scales{grid-template-columns:1fr 1fr}}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:20px;box-shadow:var(--lift)}
.scale-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.scale-cur{font-size:14px;font-weight:600;color:var(--ink-2);background:var(--sunken);padding:4px 10px;border-radius:8px}
.scale-when{font-size:13px;color:var(--mute)}
.scale-claim{font-size:15px;color:var(--ink-2);margin-bottom:2px}
.scale-claim b{color:var(--ink);font-weight:600}
.scale-amount{font-family:var(--display);font-size:clamp(32px,8vw,42px);font-weight:700;
  line-height:1.05;letter-spacing:-.03em;margin-bottom:18px}
.scale-amount.even{font-size:clamp(22px,5vw,26px);color:var(--ink-2)}
.beam{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.beam-name{font-size:13px;font-weight:600;white-space:nowrap}
.beam-name.a{color:var(--nico)}
.beam-name.b{color:var(--dani)}
.rail{position:relative;flex:1;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--nico-soft),var(--sunken),var(--dani-soft))}
.rail::before{content:"";position:absolute;left:50%;top:-5px;width:2px;height:14px;background:var(--line);border-radius:1px}
.pin{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
  border:3px solid var(--surface);background:var(--mute);
  transform:translate(-50%,-50%);left:50%;transition:left .5s cubic-bezier(.33,1,.68,1),background .3s}
.pin.a{background:var(--nico);box-shadow:0 2px 6px rgba(14,110,99,.3)}
.pin.b{background:var(--dani);box-shadow:0 2px 6px rgba(155,58,125,.3)}
.scale-foot{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;
  border-top:1px solid var(--line-soft);padding-top:14px;min-height:36px}
.scale-foot small{flex:1;min-width:160px;color:var(--mute);font-size:13px;line-height:1.3}
.btn-sm{padding:8px 16px;min-height:44px;border-radius:12px;font-size:14px;font-weight:600}

/* ---------- mes ---------- */
.month{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.month h2{font-size:16px;font-weight:600;margin-bottom:16px}
.mbar{margin-bottom:20px}
.mbar:last-child{margin-bottom:0}
.mbar-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mbar-cur{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.mbar-tot{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken);margin:10px 0 10px}
.split i{display:block;height:100%}
.split .a{background:var(--nico)}
.split .b{background:var(--dani)}
.split-key{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.split-key span{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.a{background:var(--nico)}
.dot.b{background:var(--dani)}

/* ---------- panel ---------- */
.panel{margin-top:30px}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;padding:10px 8px;min-height:44px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--lift-sm)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line-soft);
  width:100%;text-align:left;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--sunken)}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:18px;background:var(--sunken)}
.glyph.a{background:var(--nico-soft)}
.glyph.b{background:var(--dani-soft)}
.row-main{flex:1;min-width:0;display:block}
.row-title{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row-amt{text-align:right;flex:none}
.row-amt b{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;display:block}
.row-amt small{font-size:12px;color:var(--mute);margin-top:2px;display:block}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;
  background:var(--sunken);color:var(--ink-2);margin-right:6px;vertical-align:1px}
.chip.usd{background:var(--nico-soft);color:var(--nico)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:14.5px;line-height:1.5}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:6px;font-size:16px}
.catline{padding:14px 16px;border-top:1px solid var(--line-soft)}
.catline:first-child{border-top:0}
.catline-top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:8px}
.catline-top b{font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:15.5px}
.meter{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.subhead{padding:14px 16px 4px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:0.02em}
.subhead + .catline,.subhead + .row{border-top:0}

/* ---------- agregar ---------- */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  height:56px;padding:0 22px;border-radius:18px;background:var(--ink);color:var(--paper);
  font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 26px -8px rgba(19,26,32,.55)}
.fab:active{transform:scale(.97)}
.add-top{display:none}
@media(min-width:700px){.add-top{display:inline-flex}.fab{display:none}}

dialog{border:0;padding:0;margin:0;background:transparent;color:var(--ink);position:fixed;inset:0;
  width:100%;height:100%;max-width:none;max-height:none;overflow:hidden}
dialog:not([open]){display:none}
dialog[open]{display:flex;align-items:flex-end;justify-content:center}
dialog::backdrop{background:rgba(10,14,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;margin:0;
  border-radius:24px 24px 0 0;max-height:92dvh;display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media(min-width:620px){
  dialog[open]{align-items:center}
  .sheet{border-radius:24px;max-height:88dvh;animation:pop .2s ease;box-shadow:var(--lift)}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.sheet-head h2{flex:1;font-size:17px}
.sheet-body{padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.sheet-foot{padding:14px 18px max(16px, env(safe-area-inset-bottom));
  border-top:1px solid var(--line-soft);display:flex;gap:10px;background:var(--surface)}
.seg{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 8px;min-height:44px;border-radius:11px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--lift-sm)}
.seg.ab button[aria-pressed=true][data-v=A],.seg.ab button[aria-pressed=true][data-v=soloA]{color:var(--nico)}
.seg.ab button[aria-pressed=true][data-v=B],.seg.ab button[aria-pressed=true][data-v=soloB]{color:var(--dani)}
.amount-wrap{position:relative;margin-bottom:6px}
.amount-wrap .cur{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-family:var(--display);font-size:22px;font-weight:600;color:var(--mute);pointer-events:none}
#fMonto{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;
  padding:16px 16px 16px 58px;border-radius:16px;height:66px}
.preview{font-size:13.5px;color:var(--mute);min-height:20px;margin-bottom:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -18px;padding-left:18px;padding-right:18px;
  scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:center;gap:7px;padding:10px 14px;min-height:44px;border-radius:12px;
  border:1px solid var(--line);font-size:14.5px;font-weight:500;white-space:nowrap;background:var(--surface)}
.cats button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sliderwrap{margin-top:6px}
.sliderwrap input[type=range]{width:100%;accent-color:var(--nico);margin:6px 0;height:44px}
.pcts{display:flex;gap:6px;margin-top:2px}
.pcts button{flex:1;padding:8px 6px;min-height:44px;border-radius:11px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.pcts button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);background:var(--sunken)}
.note{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.4}
.lbl{font-size:13.5px;color:var(--ink-2);margin-bottom:8px;font-weight:500}
.gap{margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;font-size:14.5px;
  font-weight:500;z-index:60;box-shadow:var(--lift);animation:up .2s ease;white-space:nowrap}
.skeleton{height:160px;border-radius:22px;background:var(--surface);border:1px solid var(--line);
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>

<!-- ============ ENTRADA ============ -->
<section id="gate" class="gate">
  <div class="gate-card">
    <h1>Gastos de casa</h1>
    <p>Lo que gastamos, quién lo pagó y cómo queda la cuenta.</p>
    <form id="formGate" novalidate>
      <label class="field"><span>Clave</span>
        <input id="gateClave" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <label class="check"><input id="gateRec" type="checkbox" checked> No pedirla en este dispositivo</label>
      <button class="btn btn-wide" id="gateBtn" type="submit">Entrar</button>
      <p class="alert" id="gateErr"></p>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="topbar-in">
      <span class="brand">Gastos de casa</span>
      <span class="spacer"></span>
      <div class="monthnav">
        <button id="mPrev" type="button" aria-label="Mes anterior"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <span class="label" id="mLabel" title="Volver al mes actual">—</span>
        <button id="mNext" type="button" aria-label="Mes siguiente"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <button class="btn btn-sm add-top" id="bAddTop" type="button">Agregar</button>
      <button class="icon-btn" id="bSync" type="button" aria-label="Actualizar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="icon-btn" id="bOut" type="button" aria-label="Salir"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </div>

  <main>
    <section class="scales" id="scales"><div class="skeleton"></div><div class="skeleton"></div></section>

    <section class="month">
      <h2 id="monthTitle">El mes</h2>
      <div id="monthBars"></div>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="mov" aria-selected="true">Movimientos</button>
        <button role="tab" data-tab="cuo" aria-selected="false">Cuotas</button>
        <button role="tab" data-tab="cat" aria-selected="false">Categorías</button>
      </div>
      <div class="rows" id="panel"></div>
    </section>
  </main>

  <button class="fab" id="bAdd" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Agregar
  </button>
</div>

<!-- ============ FORMULARIO ============ -->
<dialog id="sheet">
  <form class="sheet" id="formGasto" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">Nuevo gasto</h2>
      <button class="icon-btn" type="button" id="bClose" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <div class="sheet-body">
      <div class="seg" id="segModo">

        <button type="button" data-v="pago" aria-pressed="false">Pago entre nosotros</button>

      <div class="gap seg" id="segMon">
        <button type="button" data-v="ARS" aria-pressed="true">Pesos</button>
        <button type="button" data-v="USD" aria-pressed="false">Dólares</button>

      <div class="gap amount-wrap">
        <span class="cur" id="fCur">$</span>
        <input id="fMonto" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0" autocomplete="off">
      </div>
      <p class="preview" id="fPrev"></p>

      <div class="soloGasto">
        <label class="field"><span>¿Qué fue?</span>
          <input id="fDesc" type="text" maxlength="60" placeholder="Supermercado, Netflix, farmacia…" autocomplete="off">
        </label>
        <p class="lbl gap">Categoría</p>
        <div class="cats" id="fCats"></div>
      </div>

      <div class="two gap">
        <label class="field" style="margin:0"><span>Fecha</span><input id="fFecha" type="date"></label>
        <div class="soloGasto"><label class="field" style="margin:0"><span>Cuotas</span><input id="fCuotas" type="number" inputmode="numeric" min="1" max="60" step="1" value="1"></label></div>
      </div>

      <div class="gap" id="boxPrimer" style="display:none">
        <label class="field" style="margin:0"><span>Primera cuota</span><select id="fPrimer"></select></label>
        <p class="note" id="fCuotaTxt"></p>
      </div>

      <p class="lbl gap" id="lPaga">¿Quién pagó?</p>
      <div class="seg ab" id="segPaga"></div>

      <div class="soloGasto">
        <p class="lbl gap">¿De quién es?</p>
        <div class="seg ab" id="segTipo"></div>

        <div class="sliderwrap gap" id="boxPct">
          <p class="lbl" id="lPct"></p>
          <input id="fPct" type="range" min="0" max="100" step="5" value="50">
          <div class="pcts" id="fPcts"></div>

    <div class="sheet-foot">
      <button class="btn btn-danger hide" type="button" id="bDel">Eliminar</button>
      <button class="btn btn-wide" type="submit" id="bSave">Guardar</button>
    </div>
  </form>
</dialog>

<script>
/* ═══════════════ CONFIGURACIÓN ═══════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbw_T6UuH6kP7SzdWtikuarMd9l5oD6CbPcDSFuTAXbYOL7kmn3WwXvb8SPpFD_Wq5ul/exec';
const NOMBRE  = { A:'Nicolás', B:'Daniela' };
const CATEGORIAS = [
  ['Supermercado','🛒'], ['Alquiler','🏠'], ['Servicios','💡'], ['Salidas','🍽️'],
  ['Transporte','🚗'], ['Salud','🩺'], ['Catalina','🐾'], ['Casa','🛋️'],
  ['Ropa','👕'], ['Viajes','✈️'], ['Regalos','🎁'], ['Otros','📦']
];
/* ════════════════════════════════════════════ */

const MONEDA = { ARS:{ sym:'$', dec:0, nom:'Pesos', eps:0.5 }, USD:{ sym:'US$', dec:2, nom:'Dólares', eps:0.005 } };
const ICONO = Object.fromEntries(CATEGORIAS);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

/* ---------- números y fechas ---------- */
function parseMonto(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').trim();
  const neg = /^-/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  if (!s) return 0;
  
  let lastComma = s.lastIndexOf(',');
  let lastDot = s.lastIndexOf('.');

  if (lastComma > -1 && lastDot > -1) {
     if (lastComma > lastDot) s = s.replace(/\./g, '').replace(',', '.');
     else s = s.replace(/,/g, '');
  } else if (lastComma > -1) {
     if (s.split(',').length > 2) {
        s = s.replace(/,/g, '');
     } else {
        s = s.replace(',', '.');
     }
  } else if (lastDot > -1) {
     if (s.split('.').length > 2) {
        s = s.replace(/\./g, '');
     } else {
        let parts = s.split('.');
        if (parts[1].length === 3) s = s.replace('.', '');
     }
  }
  const n = Number(s);
  return isFinite(n) ? (neg ? -n : n) : 0;
}
function fmt(n, mon='ARS'){
  const c = MONEDA[mon] || MONEDA.ARS;
  const f = 10 ** c.dec;
  let v = Math.round((Number(n)||0) * f) / f;
  if (Object.is(v,-0)) v = 0;
  return (v<0 ? '-' : '') + c.sym + ' ' +
    Math.abs(v).toLocaleString('es-AR', { minimumFractionDigits:c.dec, maximumFractionDigits:c.dec });
}
function hoyISO(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addM(mes, k){
  const [y,m] = String(mes).split('-').map(Number);
  const t = y*12 + (m-1) + k;
  return `${Math.floor(t/12)}-${pad(t%12 + 1)}`;
}
function nombreMes(mes, largo=true){
  if (!/^\d{4}-\d{2}$/.test(String(mes||''))) return '—';
  const [y,m] = mes.split('-').map(Number);
  const s = new Date(y, m-1, 1).toLocaleDateString('es-AR', largo ? { month:'long', year:'numeric' } : { month:'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function diaCorto(f){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(f||''))) return '';
  const [y,m,d] = f.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('es-AR', { day:'numeric', month:'short' }).replace('.','');
}
function normMes(v){
  const s = String(v ?? '').replace(/^'/, '').trim();
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,7);
  return '';
}
function normFecha(v){
  const s = String(v ?? '').replace(/^'/, '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0,10);
  return hoyISO();
}
function store(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ---------- estado ---------- */
let clave = null, rows = [], mes = hoyISO().slice(0,7), tab = 'mov', editando = null, cargando = false;
const F = { modo:'gasto', moneda:'ARS', paga:'A', tipo:'compartido', cat:CATEGORIAS[0][0], pct:50 };

/* ---------- conexión ---------- */
async function api(body){
  if (!/^https:\/\/script\.google\.com\//.test(API_URL))
    throw new Error('Falta pegar la dirección del script en API_URL.');
  
  // Agregar la clave SIEMPRE en la URL para evitar errores 302 de Apps Script
  const url = new URL(API_URL);
  url.searchParams.append('clave', clave);
  url.searchParams.append('t', Date.now());

  let res, txt;
  try {
    if (body) {
      res = await fetch(url.toString(), { 
        method: 'POST', 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
        body: JSON.stringify({ ...body, clave }) 
      });
    } else {
      res = await fetch(url.toString());
    }
    txt = await res.text();
  } catch (e) {
    throw new Error('No hay conexión con la planilla. Revisá internet y volvé a intentar.');
  }
  let j;
  try { j = JSON.parse(txt); }
  catch (e) { throw new Error('La planilla respondió algo inesperado. Volvé a publicar el script desde Implementar → Administrar implementaciones.'); }
  if (!j.ok) throw new Error(j.error === 'Clave incorrecta' ? 'Clave incorrecta' : (j.error || 'Algo salió mal.'));
  rows = (j.rows || []).map(r => {
    const fecha = normFecha(r.fecha);
    const tipo = ['compartido','soloA','soloB','pago'].includes(r.tipo) ? r.tipo : 'compartido';
    const pct = Number(r.pctA);
    return {
      id: String(r.id || ''),
      fecha,
      descripcion: String(r.descripcion || ''),
      categoria: String(r.categoria || ''),
      monto: Math.abs(parseMonto(r.monto)),
      pagadoPor: r.pagadoPor === 'B' ? 'B' : 'A',
      tipo,
      pctA: isFinite(pct) && pct >= 0 && pct <= 100 ? pct : 50,
      cuotas: Math.min(60, Math.max(1, parseInt(r.cuotas, 10) || 1)),
      primerMes: normMes(r.primerMes) || fecha.slice(0,7),
      moneda: r.moneda === 'USD' ? 'USD' : 'ARS'
    };
  });
  return j;
}

/* ---------- cálculo ---------- */
function parteA(r){
  if (r.tipo === 'soloA') return 1;
  if (r.tipo === 'soloB') return 0;
  return r.pctA / 100;
}
function cuotasDe(r){
  const n = r.cuotas;
  const base = Math.round((r.monto / n) * 100) / 100;
  return Array.from({ length:n }, (_, k) => ({
    mes: addM(r.primerMes, k),
    n: k + 1,
    monto: k === n - 1 ? Math.round((r.monto - base * (n - 1)) * 100) / 100 : base
  }));
}
function saldo(hasta, mon){
  let vencido = 0, total = 0;
  for (const r of rows){
    if (r.moneda !== mon) continue;
    if (r.tipo === 'pago'){
      const v = r.pagadoPor === 'A' ? r.monto : -r.monto;
      total += v;
      if (r.primerMes <= hasta) vencido += v;
      continue;
    }
    const pA = parteA(r);
    const factor = r.pagadoPor === 'A' ? (1 - pA) : -pA;
    for (const c of cuotasDe(r)){
      const v = c.monto * factor;
      total += v;
      if (c.mes <= hasta) vencido += v;
    }
  }
  return { vencido, total };
}
function movimientosDe(m){
  const out = [];
  for (const r of rows){
    if (r.tipo === 'pago'){
      if (r.primerMes === m) out.push({ r, c:{ monto:r.monto, n:1 } });
      continue;
    }
    for (const c of cuotasDe(r)) if (c.mes === m) out.push({ r, c });
  }
  return out.sort((x,y) => (y.r.fecha || '').localeCompare(x.r.fecha || '') || (y.c.monto - x.c.monto));
}
function resumen(items, mon){
  const o = { total:0, aA:0, aB:0, pagA:0, pagB:0 };
  for (const { r, c } of items){
    if (r.tipo === 'pago' || r.moneda !== mon) continue;
    const pA = parteA(r);
    o.total += c.monto;
    o.aA += c.monto * pA;
    o.aB += c.monto * (1 - pA);
    if (r.pagadoPor === 'A') o.pagA += c.monto; else o.pagB += c.monto;
  }
  return o;
}
function pendientes(desde){
  return rows
    .filter(r => r.tipo !== 'pago' && r.cuotas > 1 && addM(r.primerMes, r.cuotas - 1) > desde)
    .map(r => {
      const resto = cuotasDe(r).filter(c => c.mes > desde);
      return { r, resto, falta: resto.reduce((s,c) => s + c.monto, 0) };
    })
    .sort((a,b) => a.resto[a.resto.length-1].mes.localeCompare(b.resto[b.resto.length-1].mes));
}

/* ---------- dibujo ---------- */
function pintarBalanzas(){
  const items = movimientosDe(mes);
  $('#scales').innerHTML = ['ARS','USD'].map(mon => {
    const c = MONEDA[mon];
    const { vencido, total } = saldo(mes, mon);
    const futuro = total - vencido;
    const deudor = vencido > c.eps ? 'B' : vencido < -c.eps ? 'A' : null;
    const acreedor = deudor === 'B' ? 'A' : 'B';
    const escala = Math.max(Math.abs(vencido), resumen(items, mon).total / 2, Math.abs(total), c.eps * 2);
    const pos = 50 + 44 * Math.max(-1, Math.min(1, vencido / escala));

    const titular = deudor
      ? `<p class="scale-claim"><b>${NOMBRE[deudor]}</b> le debe a ${NOMBRE[acreedor]}</p>
         <p class="scale-amount num">${esc(fmt(Math.abs(vencido), mon))}</p>`
      : `<p class="scale-claim">La cuenta está saldada</p>
         <p class="scale-amount even num">Están a mano</p>`;

    let pie = '<small>Sin cuotas pendientes</small>';
    if (Math.abs(futuro) > c.eps){
      if (Math.abs(total) <= c.eps) pie = '<small>Con las cuotas que vienen quedan a mano</small>';
      else {
        const dTot = total > 0 ? 'B' : 'A', aTot = dTot === 'B' ? 'A' : 'B';
        pie = `<small>Con las cuotas que vienen, ${esc(NOMBRE[dTot])} le deberá ${esc(fmt(Math.abs(total), mon))} a ${esc(NOMBRE[aTot])}</small>`;
      }
    }

    return `<article class="scale">
      <div class="scale-top">
        <span class="scale-cur">${c.nom}</span>
        <span class="scale-when">al cierre de ${esc(nombreMes(mes, false).toLowerCase())}</span>
      </div>
      ${titular}
      <div class="beam">
        <span class="beam-name a">${esc(NOMBRE.A)}</span>
        <span class="rail"><i class="pin ${deudor ? (deudor === 'B' ? 'b' : 'a') : ''}" style="left:${pos.toFixed(1)}%"></i></span>
        <span class="beam-name b">${esc(NOMBRE.B)}</span>
      </div>
      <div class="scale-foot">
        ${pie}
        ${deudor ? `<button class="btn btn-quiet btn-sm" type="button" data-saldar="${mon}">Saldar</button>` : ''}
      </div>
    </article>`;
  }).join('');
}

function pintarMes(){
  const items = movimientosDe(mes);
  $('#monthTitle').textContent = nombreMes(mes);
  const barras = [];
  for (const mon of ['ARS','USD']){
    const r = resumen(items, mon);
    if (r.total <= 0) continue;
    const pct = (r.pagA / r.total) * 100;
    barras.push(`<div class="mbar">
      <div class="mbar-top">
        <span class="mbar-cur">${esc(MONEDA[mon].nom)}</span>
        <b class="mbar-tot">${esc(fmt(r.total, mon))}</b>
      </div>
      <div class="split"><i class="a" style="width:${pct.toFixed(1)}%"></i><i class="b" style="width:${(100-pct).toFixed(1)}%"></i></div>
      <div class="split-key">
        <span><i class="dot a"></i>${esc(NOMBRE.A)} puso ${esc(fmt(r.pagA, mon))}</span>
        <span><i class="dot b"></i>${esc(NOMBRE.B)} puso ${esc(fmt(r.pagB, mon))}</span>
      </div>
    </div>`);
  }
  $('#monthBars').innerHTML = barras.length ? barras.join('')
    : `<p style="color:var(--mute);font-size:14.5px">Todavía no cargaron nada este mes.</p>`;
}

function filaMovimiento({ r, c }){
  const pago = r.tipo === 'pago';
  const quien = pago
    ? `${NOMBRE[r.pagadoPor]} le pasó plata a ${NOMBRE[r.pagadoPor === 'A' ? 'B' : 'A']}`
    : `Lo pagó ${NOMBRE[r.pagadoPor]}`;
  const dueño = pago ? ''
    : r.tipo === 'compartido'
      ? (r.pctA === 50 ? '<span class="chip">Mitad y mitad</span>' : `<span class="chip">${Math.round(r.pctA)}/${100-Math.round(r.pctA)}</span>`)
      : `<span class="chip">Solo ${esc(NOMBRE[r.tipo === 'soloA' ? 'A' : 'B'])}</span>`;
  const usd = r.moneda === 'USD' ? '<span class="chip usd">USD</span>' : '';
  const titulo = pago ? 'Pago entre nosotros' : (r.descripcion || r.categoria || 'Gasto');
  return `<button class="row" type="button" data-edit="${esc(r.id)}">
    <span class="glyph ${r.pagadoPor === 'A' ? 'a' : 'b'}">${pago ? '🤝' : (ICONO[r.categoria] || '📦')}</span>
    <span class="row-main">
      <span class="row-title">${esc(titulo)}</span>
      <span class="row-sub">${usd}${dueño}${esc(quien)}</span>
    </span>
    <span class="row-amt">
      <b>${esc(fmt(c.monto, r.moneda))}</b>
      <small>${r.cuotas > 1 ? `cuota ${c.n} de ${r.cuotas}` : esc(diaCorto(r.fecha))}</small>
    </span>
  </button>`;
}

function pintarPanel(){
  const caja = $('#panel');
  if (tab === 'mov'){
    const items = movimientosDe(mes);
    caja.innerHTML = items.length
      ? items.map(filaMovimiento).join('')
      : `<p class="empty"><b>Mes en blanco</b>Cargá el primer gasto de ${esc(nombreMes(mes, false).toLowerCase())}.</p>`;
    return;
  }
  if (tab === 'cuo'){
    const p = pendientes(mes);
    if (!p.length){ caja.innerHTML = `<p class="empty"><b>Sin cuotas por delante</b>Después de ${esc(nombreMes(mes, false).toLowerCase())} no queda nada por pagar.</p>`; return; }
    const tot = { ARS:0, USD:0 };
    p.forEach(x => tot[x.r.moneda] += x.falta);
    caja.innerHTML = p.map(({ r, resto, falta }) => `
      <button class="row" type="button" data-edit="${esc(r.id)}">
        <span class="glyph ${r.pagadoPor === 'A' ? 'a' : 'b'}">${ICONO[r.categoria] || '📦'}</span>
        <span class="row-main">
          <span class="row-title">${esc(r.descripcion || r.categoria || 'Gasto')}</span>
          <span class="row-sub">${r.moneda === 'USD' ? '<span class="chip usd">USD</span>' : ''}Quedan ${resto.length} de ${r.cuotas}, termina en ${esc(nombreMes(resto[resto.length-1].mes, false).toLowerCase())}</span>
        </span>
        <span class="row-amt"><b>${esc(fmt(falta, r.moneda))}</b><small>${esc(fmt(r.monto / r.cuotas, r.moneda))} por mes</small></span>
      </button>`).join('')
      + ['ARS','USD'].filter(m => tot[m] > MONEDA[m].eps).map(m => `
        <div class="row" style="pointer-events:none;background:var(--sunken)">
          <span class="row-main"><span class="row-title">Falta pagar en ${esc(MONEDA[m].nom.toLowerCase())}</span></span>
          <span class="row-amt"><b>${esc(fmt(tot[m], m))}</b></span>
        </div>`).join('');
    return;
  }
  const items = movimientosDe(mes);
  let html = '';
  for (const mon of ['ARS','USD']){
    const porCat = {};
    for (const { r, c } of items){
      if (r.tipo === 'pago' || r.moneda !== mon) continue;
      const k = r.categoria || 'Otros';
      porCat[k] = (porCat[k] || 0) + c.monto;
    }
    const ent = Object.entries(porCat).sort((a,b) => b[1] - a[1]);
    if (!ent.length) continue;
    const top = ent[0][1];
    html += `<p class="subhead">${esc(MONEDA[mon].nom)}</p>` + ent.map(([k,v]) => `
      <div class="catline">
        <div class="catline-top"><span>${ICONO[k] || '📦'} ${esc(k)}</span><b class="num">${esc(fmt(v, mon))}</b></div>
        <div class="meter"><i style="width:${(v/top*100).toFixed(1)}%;background:${mon === 'USD' ? 'var(--nico)' : 'var(--ink-2)'}"></i></div>
      </div>`).join('');
  }
  caja.innerHTML = html || `<p class="empty"><b>Nada que repartir</b>Cuando carguen gastos vas a ver en qué se fue la plata.</p>`;
}

function pintar(){
  $('#mLabel').textContent = nombreMes(mes);
  pintarBalanzas(); pintarMes(); pintarPanel();
}

/* ---------- formulario ---------- */
function marcar(cont, valor){
  $$(cont + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === valor)));
}
function pintarSegmentos(){
  $('#segPaga').innerHTML = `<button type="button" data-v="A">${esc(NOMBRE.A)}</button><button type="button" data-v="B">${esc(NOMBRE.B)}</button>`;
  $('#segTipo').innerHTML = `<button type="button" data-v="compartido">De los dos</button><button type="button" data-v="soloA">Solo ${esc(NOMBRE.A)}</button><button type="button" data-v="soloB">Solo ${esc(NOMBRE.B)}</button>`;
  $('#fCats').innerHTML = CATEGORIAS.map(([n,i]) => `<button type="button" data-v="${esc(n)}"><span>${i}</span>${esc(n)}</button>`).join('');
  $('#fPcts').innerHTML = [50,60,70].map(p => `<button type="button" data-v="${p}">${p}/${100-p}</button>`).join('');
}
function refrescarForm(){
  const esPago = F.modo === 'pago';
  $$('.soloGasto').forEach(e => e.classList.toggle('hide', esPago));
  $('#sheetTitle').textContent = editando ? (esPago ? 'Editar pago' : 'Editar gasto') : (esPago ? 'Nuevo pago' : 'Nuevo gasto');
  $('#lPaga').textContent = esPago ? '¿Quién le pasó la plata al otro?' : '¿Quién pagó?';
  $('#fCur').textContent = MONEDA[F.moneda].sym;
  marcar('#segModo', F.modo); marcar('#segMon', F.moneda);
  marcar('#segPaga', F.paga); marcar('#segTipo', F.tipo);
  marcar('#fCats', F.cat); marcar('#fPcts', String(F.pct));
  $('#boxPct').classList.toggle('hide', esPago || F.tipo !== 'compartido');
  $('#lPct').textContent = `${NOMBRE.A} ${F.pct}% · ${NOMBRE.B} ${100-F.pct}%`;
  $('#fPct').value = F.pct;

  const monto = parseMonto($('#fMonto').value);
  $('#fPrev').textContent = monto > 0 ? `Se guarda como ${fmt(monto, F.moneda)}` : '';

  const n = Math.max(1, Math.min(60, parseInt($('#fCuotas').value, 10) || 1));
  $('#boxPrimer').style.display = (!esPago && n > 1) ? '' : 'none';
  if (n > 1){
    const desde = $('#fPrimer').value || ($('#fFecha').value || hoyISO()).slice(0,7);
    $('#fCuotaTxt').textContent = monto > 0
      ? `${n} cuotas de ${fmt(monto/n, F.moneda)}, de ${nombreMes(desde, false).toLowerCase()} a ${nombreMes(addM(desde, n-1)).toLowerCase()}.`
      : `${n} cuotas, de ${nombreMes(desde, false).toLowerCase()} a ${nombreMes(addM(desde, n-1)).toLowerCase()}.`;
  }
}
function setPrimer(v){
  const sel = $('#fPrimer');
  const base = hoyISO().slice(0,7);
  const set = new Set();
  for (let k = -12; k <= 36; k++) set.add(addM(base, k));
  if (/^\d{4}-\d{2}$/.test(v)) set.add(v);
  sel.innerHTML = [...set].sort().map(m => `<option value="${m}">${esc(nombreMes(m))}</option>`).join('');
  sel.value = /^\d{4}-\d{2}$/.test(v) ? v : base;
}
function abrirDialogo(){
  const d = $('#sheet');
  if (d.open) return;
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
function cerrarDialogo(){
  const d = $('#sheet');
  if (typeof d.close === 'function') { if (d.open) d.close(); } else d.removeAttribute('open');
}
function abrirSheet(){
  $('#fErr').textContent = '';
  abrirDialogo();
  refrescarForm();
  $('.sheet-body').scrollTop = 0;
}

function nuevo(prefill = {}){
  editando = null;
  Object.assign(F, { modo:'gasto', moneda:'ARS', paga:'A', tipo:'compartido', cat:CATEGORIAS[0][0], pct:50 }, prefill);
  $('#fMonto').value = prefill.monto ? String(prefill.monto).replace('.', ',') : '';
  $('#fDesc').value = '';
  $('#fCuotas').value = 1;
  $('#fFecha').value = hoyISO();
  setPrimer(mes);
  $('#bDel').classList.add('hide');
  $('#bSave').textContent = 'Guardar';
  abrirSheet();
}
function editar(id){
  const r = rows.find(x => x.id === id);
  if (!r) return;
  editando = id;
  Object.assign(F, {
    modo: r.tipo === 'pago' ? 'pago' : 'gasto',
    moneda: r.moneda, paga: r.pagadoPor,
    tipo: r.tipo === 'pago' ? 'compartido' : r.tipo,
    cat: ICONO[r.categoria] ? r.categoria : CATEGORIAS[CATEGORIAS.length-1][0],
    pct: r.pctA
  });
  $('#fMonto').value = String(r.monto).replace('.', ',');
  $('#fDesc').value = r.tipo === 'pago' ? '' : r.descripcion;
  $('#fCuotas').value = r.cuotas;
  $('#fFecha').value = r.fecha;
  setPrimer(r.primerMes);
  $('#bDel').classList.remove('hide');
  $('#bSave').textContent = 'Guardar cambios';
  abrirSheet();
}

/* ---------- avisos ---------- */
let tToast;
function claveVencida(){
  store('gastos_clave', null); clave = null;
  cerrarDialogo();
  $('#app').classList.add('hide'); $('#gate').classList.remove('hide');
  $('#gateErr').textContent = 'La clave guardada ya no sirve o cambió. Volvé a escribirla.';
}
function toast(txt){
  clearTimeout(tToast);
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = txt; el.setAttribute('role','status');
  document.body.appendChild(el);
  tToast = setTimeout(() => el.remove(), 2600);
}

/* ---------- eventos ---------- */
$('#segModo').onclick = e => { const b = e.target.closest('button'); if (!b) return; F.modo = b.dataset.v; refrescarForm(); };
$('#segMon').onclick  = e => { const b = e.target.closest('button'); if (!b) return; F.moneda = b.dataset.v; refrescarForm(); };
$('#segPaga').onclick = e => { const b = e.target.closest('button'); if (!b) return; F.paga = b.dataset.v; refrescarForm(); };
$('#segTipo').onclick = e => { const b = e.target.closest('button'); if (!b) return; F.tipo = b.dataset.v; refrescarForm(); };
$('#fCats').onclick   = e => { const b = e.target.closest('button'); if (!b) return; F.cat = b.dataset.v; refrescarForm(); };
$('#fPcts').onclick   = e => { const b = e.target.closest('button'); if (!b) return; F.pct = +b.dataset.v; refrescarForm(); };
$('#fPct').oninput    = e => { F.pct = +e.target.value; refrescarForm(); };
['#fMonto','#fCuotas','#fFecha','#fPrimer'].forEach(s => { $(s).addEventListener('input', refrescarForm); $(s).addEventListener('change', refrescarForm); });
$('#fFecha').addEventListener('change', () => { setPrimer(($('#fFecha').value || hoyISO()).slice(0,7)); refrescarForm(); });
$('#bClose').onclick = cerrarDialogo;
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) cerrarDialogo(); });
$('#sheet').addEventListener('cancel', () => {});
$('#bAdd').onclick = () => nuevo();
$('#bAddTop').onclick = () => nuevo();

$('#formGasto').addEventListener('submit', async e => {
  e.preventDefault();
  $('#fErr').textContent = '';
  const monto = parseMonto($('#fMonto').value);
  if (!(monto > 0)){ $('#fErr').textContent = 'Poné cuánto fue.'; $('#fMonto').focus(); return; }
  const fecha = $('#fFecha').value || hoyISO();
  const esPago = F.modo === 'pago';
  const cuotas = esPago ? 1 : Math.max(1, Math.min(60, parseInt($('#fCuotas').value, 10) || 1));
  const primer = esPago ? fecha.slice(0,7) : (cuotas > 1 ? ($('#fPrimer').value || fecha.slice(0,7)) : fecha.slice(0,7));
  const row = {
    fecha,
    descripcion: esPago ? 'Pago entre nosotros' : ($('#fDesc').value.trim() || F.cat),
    categoria: esPago ? '' : F.cat,
    monto: String(monto),
    pagadoPor: F.paga,
    tipo: esPago ? 'pago' : F.tipo,
    pctA: esPago || F.tipo !== 'compartido' ? '' : String(F.pct),
    cuotas: String(cuotas),
    primerMes: primer,
    moneda: F.moneda
  };
  $('#bSave').disabled = true;
  try {
    await api(editando ? { action:'update', id:editando, row } : { action:'add', row });
    cerrarDialogo();
    mes = primer;
    pintar();
    toast(editando ? 'Cambios guardados' : (esPago ? 'Pago registrado' : 'Gasto cargado'));
  } catch (err){ if (err.message === 'Clave incorrecta') return claveVencida(); $('#fErr').textContent = err.message; }
  finally { $('#bSave').disabled = false; }
});

$('#bDel').onclick = async () => {
  const r = rows.find(x => x.id === editando);
  if (!r) return;
  const aviso = r.cuotas > 1
    ? `Se borran las ${r.cuotas} cuotas de "${r.descripcion}". ¿Seguimos?`
    : '¿Borrar este movimiento?';
  if (!confirm(aviso)) return;
  $('#bDel').disabled = true;
  try { await api({ action:'delete', id:editando }); cerrarDialogo(); pintar(); toast('Movimiento borrado'); }
  catch (err){ if (err.message === 'Clave incorrecta') return claveVencida(); $('#fErr').textContent = err.message; }
  finally { $('#bDel').disabled = false; }
};

document.addEventListener('click', e => {
  const fila = e.target.closest('[data-edit]');
  if (fila){ editar(fila.dataset.edit); return; }
  const sal = e.target.closest('[data-saldar]');
  if (sal){
    const mon = sal.dataset.saldar;
    const { vencido } = saldo(mes, mon);
    nuevo({ modo:'pago', moneda:mon, paga: vencido > 0 ? 'B' : 'A', monto: Math.abs(Math.round(vencido * 100) / 100) });
  }
});

$$('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  pintarPanel();
});
$('#mPrev').onclick = () => { mes = addM(mes, -1); pintar(); };
$('#mNext').onclick = () => { mes = addM(mes, 1); pintar(); };
$('#mLabel').onclick = () => { mes = hoyISO().slice(0,7); pintar(); };

async function sincronizar(silencioso = true){
  if (cargando) return;
  cargando = true;
  $('#bSync').classList.add('spin');
  try { await api(); pintar(); if (!silencioso) toast('Al día'); }
  catch (err){ if (!silencioso) toast(err.message); }
  finally { cargando = false; $('#bSync').classList.remove('spin'); }
}
$('#bSync').onclick = () => sincronizar(false);
document.addEventListener('visibilitychange', () => { if (!document.hidden && clave) sincronizar(true); });

$('#bOut').onclick = () => { store('gastos_clave', null); location.reload(); };

/* ---------- entrada ---------- */
async function entrar(c, recordar){
  clave = c;
  await api();
  if (recordar) store('gastos_clave', c);
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  pintar();
}
$('#formGate').addEventListener('submit', async e => {
  e.preventDefault();
  $('#gateErr').textContent = '';
  $('#gateBtn').disabled = true;
  try { await entrar($('#gateClave').value, $('#gateRec').checked); }
  catch (err){ $('#gateErr').textContent = err.message; clave = null; }
  finally { $('#gateBtn').disabled = false; }
});

/* ---------- arranque ---------- */
pintarSegmentos();
const guardada = recall('gastos_clave');
if (guardada) entrar(guardada, true).catch(() => { store('gastos_clave', null); clave = null; });
</script>
</body>
</html>
