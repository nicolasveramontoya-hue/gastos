<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos de la casa</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e4e2dc;--a:#2f6fed;--b:#d9468b;--ok:#1f9d6b;--warn:#c2410c;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f2f2f3;--mute:#9a9aa2;--line:#2c2c31;--a:#6b9bff;--b:#f07ab2;--ok:#3ccf95;--warn:#fb923c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .s{color:var(--mute);font-size:13px;margin-top:2px}
.dotA{color:var(--a)}.dotB{color:var(--b)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:transparent;color:var(--ink);font-weight:500;padding:9px 6px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .d{font-weight:600}
.it .m{color:var(--mute);font-size:13px;margin-top:2px}
.it .r{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);margin-right:4px}
.x{background:none;color:var(--mute);padding:2px 6px;font-size:13px;border:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--a)}
.muted{color:var(--mute)}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.login{max-width:360px;margin:12vh auto}
.hide{display:none!important}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.cols{grid-template-columns:360px 1fr}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login" class="wrap">
  <div class="card login">
    <h1>Gastos de la casa</h1>
    <p class="muted">Ingresá la clave para ver los gastos.</p>
    <form id="fLogin">
      <input id="clave" type="password" placeholder="Clave" autocomplete="current-password" required>
      <label style="display:flex;gap:8px;align-items:center"><input id="recordar" type="checkbox" style="width:auto" checked> Recordar en este dispositivo</label>
      <button style="width:100%;margin-top:10px" id="bLogin">Entrar</button>
      <div id="loginErr" class="err"></div>
    </form>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="wrap hide">
  <header>
    <h1>Gastos de la casa</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="mes" type="month" style="width:auto">
      <button class="sec" id="bSalir">Salir</button>
    </div>
  </header>

  <div class="grid">
    <div class="card kpi"><h2>Gastado en el mes</h2><div class="v" id="kTotal">–</div><div class="s" id="kTotalS"></div></div>
    <div class="card kpi"><h2>Le corresponde a cada uno</h2><div class="v" style="font-size:17px"><span class="dotA" id="kA">–</span><br><span class="dotB" id="kB">–</span></div></div>
    <div class="card kpi"><h2>Balance acumulado</h2><div class="v" id="kBal">–</div><div class="s" id="kBalS"></div></div>
  </div>

  <div class="cols">
    <!-- Formulario -->
    <div class="card">
      <div class="seg" id="segModo"><button type="button" data-v="gasto" class="on">Gasto</button><button type="button" data-v="pago">Pago entre nosotros</button></div>
      <form id="fGasto">
        <div class="row2">
          <div><label>Fecha</label><input id="gFecha" type="date" required></div>
          <div><label>Monto total</label><input id="gMonto" inputmode="decimal" placeholder="0" required></div>
        </div>
        <div class="soloGasto">
          <label>Descripción</label><input id="gDesc" placeholder="Ej: supermercado" maxlength="80">
          <label>Categoría</label>
          <select id="gCat"></select>
        </div>
        <label id="lPaga">¿Quién pagó?</label>
        <div class="seg" id="segPaga"></div>
        <div class="soloGasto">
          <label>¿De quién es el gasto?</label>
          <div class="seg" id="segTipo"></div>
          <div id="boxPct">
            <label>División: <span id="pctTxt"></span></label>
            <input id="gPct" type="range" min="0" max="100" step="5" value="50">
          </div>
          <div class="row2">
            <div><label>Cuotas</label><input id="gCuotas" type="number" min="1" max="60" value="1"></div>
            <div><label>Primera cuota</label><input id="gPrimer" type="month"></div>
          </div>
          <div class="muted" id="cuotaTxt" style="font-size:13px;margin-top:6px"></div>
        </div>
        <button style="width:100%;margin-top:14px" id="bGuardar">Guardar</button>
        <div id="formErr" class="err"></div>
      </form>
    </div>

    <div>
      <div class="card"><h2>Movimientos del mes</h2><div class="list" id="lista"></div></div>
      <div class="card"><h2>Por categoría</h2><div id="cats"></div></div>
      <div class="card"><h2>Cuotas que siguen</h2><div class="list" id="cuotas"></div></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hide"></div>

<script>
// ================== CONFIGURACIÓN ==================
const API_URL = 'https://script.google.com/macros/s/AKfycbxAjsU6uFW9RuwrRqTTJk-IBdxFmZZasbs2t2kMJXP2SW5MIAWkRmDx2MqECZFiPR5Z/exec';
const NOMBRE = { A: 'Nicolás', B: 'Daniela' };
const CATEGORIAS = ['Supermercado','Alquiler / Expensas','Servicios','Salidas y delivery','Transporte','Salud','Catalina','Hogar','Ropa','Viajes','Otros'];
// ===================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n) || 0).toLocaleString('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 });
const pad = n => String(n).padStart(2,'0');
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addM = (m, k) => { const [y,mo] = m.split('-').map(Number); const t = y*12 + mo-1 + k; return `${Math.floor(t/12)}-${pad(t%12+1)}`; };
const nombreMes = m => { const [y,mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString('es-AR', { month:'long', year:'numeric' }); };
function parseMonto(s){ s = String(s).trim().replace(/\$|\s/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.'); return Number(s); }
function guardar(k,v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.remove('hide'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add('hide'),2200); }

let clave = null, rows = [];
const estado = { modo:'gasto', paga:'A', tipo:'compartido' };

// ---------- API ----------
async function api(body){
  if (!API_URL.startsWith('https://')) throw new Error('Falta configurar API_URL en index.html');
  const r = body
    ? await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ ...body, clave }) })
    : await fetch(API_URL + '?clave=' + encodeURIComponent(clave));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error');
  rows = j.rows.map(r => ({ ...r, monto:+r.monto||0, cuotas:Math.max(1,+r.cuotas||1), pctA: r.pctA===''?50:+r.pctA }));
  return j;
}

// ---------- Cálculos ----------
function shareA(r){ return r.tipo==='compartido' ? r.pctA/100 : r.tipo==='soloA' ? 1 : 0; }
function cuotasDe(r){ const c = r.monto / r.cuotas; return Array.from({length:r.cuotas}, (_,k) => ({ mes: addM(r.primerMes, k), n:k+1, monto:c })); }

// Balance positivo = Daniela le debe a Nicolás
function balanceHasta(mes){
  let bal = 0;
  for (const r of rows){
    if (r.tipo === 'pago'){ if (r.primerMes <= mes) bal += r.pagadoPor==='A' ? r.monto : -r.monto; continue; }
    const sA = shareA(r);
    for (const c of cuotasDe(r)) if (c.mes <= mes) bal += r.pagadoPor==='A' ? c.monto*(1-sA) : -c.monto*sA;
  }
  return bal;
}

// ---------- Render ----------
function render(){
  const mes = $('#mes').value;
  const items = [];
  for (const r of rows){
    if (r.tipo === 'pago'){ if (r.primerMes === mes) items.push({ r, c:{ monto:r.monto, n:1 } }); continue; }
    for (const c of cuotasDe(r)) if (c.mes === mes) items.push({ r, c });
  }
  items.sort((x,y) => (y.r.fecha||'').localeCompare(x.r.fecha||''));

  let total=0, toA=0, toB=0, pagA=0, pagB=0; const porCat = {};
  for (const {r,c} of items){
    if (r.tipo==='pago') continue;
    total += c.monto; const sA = shareA(r);
    toA += c.monto*sA; toB += c.monto*(1-sA);
    r.pagadoPor==='A' ? pagA += c.monto : pagB += c.monto;
    porCat[r.categoria||'Otros'] = (porCat[r.categoria||'Otros']||0) + c.monto;
  }
  $('#kTotal').textContent = fmt(total);
  $('#kTotalS').textContent = `Pagó ${NOMBRE.A} ${fmt(pagA)} · ${NOMBRE.B} ${fmt(pagB)}`;
  $('#kA').textContent = `${NOMBRE.A}: ${fmt(toA)}`;
  $('#kB').textContent = `${NOMBRE.B}: ${fmt(toB)}`;

  const bal = balanceHasta(mes);
  if (Math.abs(bal) < 1){ $('#kBal').textContent = 'Están a mano'; $('#kBal').className='v'; }
  else { $('#kBal').textContent = `${bal>0?NOMBRE.B:NOMBRE.A} debe ${fmt(Math.abs(bal))}`; $('#kBal').className = 'v ' + (bal>0?'dotB':'dotA'); }
  $('#kBalS').textContent = `Incluye cuotas y pagos hasta ${nombreMes(mes)}`;

  $('#lista').innerHTML = items.length ? items.map(({r,c}) => {
    const esPago = r.tipo==='pago';
    const quien = esPago ? `${NOMBRE[r.pagadoPor]} le pagó a ${NOMBRE[r.pagadoPor==='A'?'B':'A']}`
      : `Pagó ${NOMBRE[r.pagadoPor]}`;
    const de = esPago ? '' : r.tipo==='compartido' ? `<span class="tag">Compartido ${Math.round(r.pctA)}/${100-Math.round(r.pctA)}</span>`
      : `<span class="tag">Solo ${NOMBRE[r.tipo==='soloA'?'A':'B']}</span>`;
    const cuota = r.cuotas>1 ? `<span class="tag">Cuota ${c.n}/${r.cuotas}</span>` : '';
    return `<div class="it"><div><div class="d">${esc(esPago?'Pago entre nosotros':r.descripcion||r.categoria)}</div>
      <div class="m">${de}${cuota}${esc(r.categoria&&!esPago?r.categoria+' · ':'')}${quien} · ${esc(r.fecha)}</div></div>
      <div class="r"><div class="d">${fmt(c.monto)}</div><button class="x" data-del="${esc(r.id)}">Borrar</button></div></div>`;
  }).join('') : '<div class="muted">No hay movimientos este mes.</div>';

  const maxC = Math.max(1, ...Object.values(porCat));
  $('#cats').innerHTML = Object.keys(porCat).length ? Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${fmt(v)}</span></div><div class="bar"><i style="width:${v/maxC*100}%"></i></div></div>`
  ).join('') : '<div class="muted">Sin gastos este mes.</div>';

  const pend = rows.filter(r => r.tipo!=='pago' && r.cuotas>1 && addM(r.primerMes, r.cuotas-1) > mes).map(r => {
    const rest = cuotasDe(r).filter(c => c.mes > mes);
    return { r, rest, falta: rest.reduce((s,c)=>s+c.monto,0) };
  });
  const totPend = pend.reduce((s,p)=>s+p.falta,0);
  $('#cuotas').innerHTML = pend.length ? pend.map(({r,rest,falta}) =>
    `<div class="it"><div><div class="d">${esc(r.descripcion||r.categoria)}</div><div class="m">Quedan ${rest.length} de ${r.cuotas} · termina ${nombreMes(rest[rest.length-1].mes)}</div></div>
     <div class="r"><div class="d">${fmt(falta)}</div><div class="m">${fmt(r.monto/r.cuotas)}/mes</div></div></div>`
  ).join('') + `<div class="it"><div class="d">Total comprometido a futuro</div><div class="d">${fmt(totPend)}</div></div>`
  : '<div class="muted">No quedan cuotas después de este mes.</div>';
}

// ---------- Formulario ----------
function seg(id, opts, key){
  const el = $(id);
  el.innerHTML = opts.map(([v,t]) => `<button type="button" data-v="${v}">${t}</button>`).join('');
  const pintar = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v===estado[key]));
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; estado[key]=b.dataset.v; pintar(); actualizarForm(); };
  pintar();
}
function actualizarForm(){
  const pago = estado.modo==='pago';
  document.querySelectorAll('.soloGasto').forEach(e => e.classList.toggle('hide', pago));
  $('#lPaga').textContent = pago ? '¿Quién le pagó al otro?' : '¿Quién pagó?';
  $('#boxPct').classList.toggle('hide', estado.tipo!=='compartido');
  const p = +$('#gPct').value;
  $('#pctTxt').textContent = `${NOMBRE.A} ${p}% · ${NOMBRE.B} ${100-p}%`;
  const n = Math.max(1, +$('#gCuotas').value||1), m = parseMonto($('#gMonto').value);
  $('#cuotaTxt').textContent = n>1 && m>0 ? `${n} cuotas de ${fmt(m/n)} (de ${nombreMes($('#gPrimer').value||$('#mes').value)} a ${nombreMes(addM($('#gPrimer').value||$('#mes').value, n-1))})` : '';
}

$('#segModo').onclick = e => { const b=e.target.closest('button'); if(!b) return; estado.modo=b.dataset.v;
  $('#segModo').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); actualizarForm(); };
['#gPct','#gCuotas','#gMonto','#gPrimer'].forEach(s => $(s).addEventListener('input', actualizarForm));
$('#gFecha').addEventListener('change', () => { $('#gPrimer').value = $('#gFecha').value.slice(0,7); actualizarForm(); });

$('#fGasto').onsubmit = async e => {
  e.preventDefault(); $('#formErr').textContent='';
  const monto = parseMonto($('#gMonto').value);
  if (!(monto>0)) { $('#formErr').textContent='Poné un monto válido.'; return; }
  const fecha = $('#gFecha').value, pago = estado.modo==='pago';
  const row = pago
    ? { fecha, descripcion:'Pago entre nosotros', categoria:'', monto, pagadoPor:estado.paga, tipo:'pago', pctA:'', cuotas:1, primerMes:fecha.slice(0,7) }
    : { fecha, descripcion:$('#gDesc').value.trim(), categoria:$('#gCat').value, monto, pagadoPor:estado.paga, tipo:estado.tipo,
        pctA: estado.tipo==='compartido' ? +$('#gPct').value : '', cuotas: Math.max(1, Math.min(60, +$('#gCuotas').value||1)),
        primerMes: $('#gPrimer').value || fecha.slice(0,7) };
  $('#bGuardar').disabled = true;
  try { await api({ action:'add', row }); $('#gMonto').value=''; $('#gDesc').value=''; $('#gCuotas').value=1; actualizarForm(); render(); toast('Guardado'); }
  catch(err){ $('#formErr').textContent = err.message; }
  finally { $('#bGuardar').disabled = false; }
};

$('#lista').onclick = async e => {
  const id = e.target.dataset?.del; if (!id) return;
  const r = rows.find(x => x.id===id);
  const aviso = r && r.cuotas>1 ? `Esto borra las ${r.cuotas} cuotas de "${r.descripcion}". ¿Seguro?` : '¿Borrar este movimiento?';
  if (!confirm(aviso)) return;
  try { await api({ action:'delete', id }); render(); toast('Borrado'); } catch(err){ alert(err.message); }
};

// ---------- Login ----------
async function entrar(c, recordar){
  clave = c;
  await api();
  if (recordar) guardar('gastos_clave', c);
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  render();
}
$('#fLogin').onsubmit = async e => {
  e.preventDefault(); $('#loginErr').textContent=''; $('#bLogin').disabled=true;
  try { await entrar($('#clave').value, $('#recordar').checked); }
  catch(err){ $('#loginErr').textContent = err.message==='Clave incorrecta' ? 'Clave incorrecta.' : err.message; }
  finally { $('#bLogin').disabled=false; }
};
$('#bSalir').onclick = () => { guardar('gastos_clave', null); clave=null; rows=[]; location.reload(); };
$('#mes').onchange = () => { $('#gPrimer').value = $('#mes').value; actualizarForm(); render(); };

// ---------- Inicio ----------
$('#gCat').innerHTML = CATEGORIAS.map(c => `<option>${esc(c)}</option>`).join('');
$('#gFecha').value = hoy(); $('#mes').value = hoy().slice(0,7); $('#gPrimer').value = hoy().slice(0,7);
seg('#segPaga', [['A',NOMBRE.A],['B',NOMBRE.B]], 'paga');
seg('#segTipo', [['compartido','De los dos'],['soloA','Solo '+NOMBRE.A],['soloB','Solo '+NOMBRE.B]], 'tipo');
actualizarForm();
const guardada = leer('gastos_clave');
if (guardada) entrar(guardada, true).catch(() => guardar('gastos_clave', null));
</script>
</body>
</html>
